name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare-state regression tests
        run: node --test tests/compare-state.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Validate generated offline scripts
        run: node --check dist/offline-client.js && node --check dist/offline-sw.js
      - name: Install isolated Playwright browser harness
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium on supported runner
        run: npx playwright install --with-deps chromium
      - name: Test responsive keyboard, URL history, theme, comparison and errors in actual Chromium
        run: node tests/ui-browser-smoke.mjs
